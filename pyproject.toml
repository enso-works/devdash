[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devdash"
dynamic = ["version"]
description = "Dashboard for dev servers, Docker containers and Claude Code, as a terminal UI and a macOS menu bar app"
requires-python = ">=3.10"
dependencies = [
    "textual>=1.0.0",
    "psutil>=5.9.0",
]

[project.scripts]
devdash = "devdash.cli:main"

[tool.hatch.version]
path = "devdash/__init__.py"
