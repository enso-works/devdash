name: macOS app

# Merging to main releases when devdash/__init__.py has a version that has no tag yet.
# Pull requests are built and tested; a PR that bumps the version also has its release notes checked.
on:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - "devdash/**"
      - "CHANGELOG.md"
      - ".github/workflows/macos-app.yml"
  pull_request:
    paths:
      - "macos/**"
      - "devdash/**"
      - "CHANGELOG.md"
      - ".github/workflows/macos-app.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version and release notes
        id: check
        run: |
          VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' devdash/__init__.py)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION is already released, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -q "^## $VERSION\$" CHANGELOG.md || { echo "::error file=CHANGELOG.md::No '## $VERSION' section in CHANGELOG.md"; exit 1; }
          grep -q "version: \"$VERSION\"" macos/Sources/DevDashBar/WhatsNew.swift \
            || { echo "::error file=macos/Sources/DevDashBar/WhatsNew.swift::No What's new entry for $VERSION"; exit 1; }
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            echo "Releasing v$VERSION."
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Merging this releases v$VERSION."
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RELEASE: ${{ needs.version.outputs.release }}
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      SIGN_IDENTITY_SECRET: ${{ secrets.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install devdash CLI
        run: pip install -e .

      - name: Self-test bridge protocol
        working-directory: macos
        run: |
          swift build
          DEVDASH_BIN="$(command -v devdash)" .build/debug/DevDashBar --selftest

      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "SIGN_IDENTITY=$SIGN_IDENTITY_SECRET" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        if: env.MACOS_CERT_P12 != '' && env.APPLE_API_KEY_P8 != ''
        run: |
          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$KEY"
          xcrun notarytool store-credentials devdash-notary \
            --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
          rm -f "$KEY"
          echo "NOTARY_PROFILE=devdash-notary" >> "$GITHUB_ENV"

      - name: Build release bundle
        run: macos/scripts/build-app.sh --release

      - name: Write Sparkle appcast
        if: env.RELEASE == 'true' && env.SPARKLE_PRIVATE_KEY != ''
        run: |
          macos/scripts/make-appcast.py "macos/dist/DevDash-$VERSION-macos.zip" "$VERSION" "$(git rev-list --count HEAD)" > macos/dist/appcast.xml

      - uses: actions/upload-artifact@v4
        with:
          name: DevDash-macos
          path: macos/dist/*

      - name: Publish GitHub release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          awk -v v="## $VERSION" '$0 == v {on=1; next} on && /^## / {exit} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          # A draft first, so the appcast and DMG are attached before the release becomes "latest".
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          gh release upload "$TAG" macos/dist/* --clobber
          gh release edit "$TAG" --draft=false --latest

      - name: Update Homebrew cask
        if: env.RELEASE == 'true' && env.TAP_DEPLOY_KEY != '' && env.MACOS_CERT_P12 != ''
        run: |
          SHA="$(shasum -a 256 "macos/dist/DevDash-$VERSION-macos.dmg" | cut -d' ' -f1)"
          KEY="$RUNNER_TEMP/tap_key"
          echo "$TAP_DEPLOY_KEY" > "$KEY" && chmod 600 "$KEY"
          export GIT_SSH_COMMAND="ssh -i $KEY -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:enso-works/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$SHA\"/" Casks/devdash.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "devdash $VERSION" && git push
          rm -f "$KEY"
